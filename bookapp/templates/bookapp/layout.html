<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books App</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #395068;
            --accent-color: #cf9c2e;
            --bg-color: #7aa7cc;
            --text-color: #333;
        }

        body {
            font-family: "Nunito Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-size: 1rem; 
        }

        header {
            background: white;
            padding: 15px 30px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px rgba(72, 70, 97, 0.1);
            margin-bottom: 30px;
        }

        a, button {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        a:hover { 
            color: var(--primary-color); 
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            font-family: "Nunito Sans", sans-serif;
            font-size: 1.1rem;
        }

        button:hover { 
            background: var(--primary-color); 
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(48, 44, 44, 0.08);
        }

        .table-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: "Nunito Sans", sans-serif;
        }

        th {
            text-transform: uppercase;
            background: #d5dfe9;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: #888;
            padding: 16px;
            text-align: left;
            border-bottom: 2px solid #737475c7;
        }

        th a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s;
        }

        th a:hover {
            color: var(--primary-color);
        }

        td {
            padding: 16px;
            color: #444;
            font-size: 0.95rem;
            border-bottom: 1px solid #f8f8f8;
        }

        tr:hover td {
            background-color: #fafafa;
            color: #000;
        }

        input[type="text"] {
            width: 100%;
            max-width: 300px;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f9f9f9;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
        }

        canvas {
            margin: 20px auto;
            max-width: 100%;
        }

        ul {
            list-style-type: none; 
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 8px; 
        }

    </style>
</head>
<body>
    <header>
        <div>
            <strong>BOOK_APP</strong>
        </div>
        <nav>
            {% if not user.is_authenticated %}
                <a href="{% url 'register' %}">Register</a> | 
                <a href="{% url 'login' %}">Log in</a>
            {% else %}
                <span>Hello, {{ user.username }}</span>
                <form method='post' action="{% url 'logout' %}" style="display:inline; margin-left:15px;">
                    {% csrf_token %}
                    <button type='submit'>Log out</button>
                </form>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock content %}
    </main>
</body>
</html>
